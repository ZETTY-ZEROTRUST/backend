spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
  application:
    name: auth-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: 8080

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

jwt:
  # 합의 AT 수명 900초. 부하 테스트 토큰 풀 재사용을 위해 env로 조정 가능.
  expiration: ${JWT_EXPIRATION:900}

zetty:
  kms:
    # 비워두면 AWS 기본 공급자. 로컬 Compose는 에뮬레이터 URL을 주입한다.
    endpoint: ${ZETTY_KMS_ENDPOINT:}
    region: ${ZETTY_KMS_REGION:ap-northeast-2}
  jwt:
    kms-key-id: ${ZETTY_JWT_KMS_KEY_ID:alias/zetty-jwt-signing}
