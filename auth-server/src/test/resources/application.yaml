spring:
  datasource:
    url: jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
management:
  server:
    port: 0
# 테스트 설정은 main application.yaml을 가린다. 컨텍스트를 띄우는 테스트에 필요한 값만 둔다.
jwt:
  expiration: 900
zetty:
  kms:
    endpoint: http://127.0.0.1:1
  events:
    # 테스트 전용 고정 키(비밀 아님): base64("zetty-test-only-hmac-key-32bytes")
    hmac-key: emV0dHktdGVzdC1vbmx5LWhtYWMta2V5LTMyYnl0ZXM=
    hmac-key-version: test-1

# springdoc 자체 기본값은 "활성"이다. 설정이 빠지면 문서가 노출되므로 테스트에도 운영과 같은 기본값을 명시한다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
