spring:
  application:
    name: bff-server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
  session:
    # 유휴 만료. 절대 만료는 zetty.bff.session-absolute-timeout(로그인 시각 기준, 연장 없음)
    timeout: ${BFF_SESSION_IDLE_TIMEOUT:30m}
    redis:
      # Auth 세션과 분리된 key namespace
      namespace: zetty:bff:session
      repository-type: default
      flush-mode: on-save
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  sql:
    init:
      # 기본은 적용하지 않는다(DDL은 별도 적용). always로 두면 bff-schema.sql을 IF NOT EXISTS로 실행.
      mode: ${BFF_SCHEMA_INIT_MODE:never}
      schema-locations: classpath:bff-schema.sql
  mvc:
    # 요청 파라미터·헤더를 DEBUG 로그에 남기지 않는다(쿠키·토큰 보호).
    log-request-details: false

server:
  port: 8082
  tomcat:
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    threads:
      max: ${TOMCAT_THREADS_MAX:200}

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

zetty:
  bff:
    auth-base-url: ${AUTH_BASE_URL:http://auth:8080}
    api-base-url: ${API_BASE_URL:http://api:8081}
    # unsafe 메서드(POST/PUT/DELETE)의 Origin과 정확히 일치해야 한다.
    allowed-origin: ${BFF_ALLOWED_ORIGIN:https://127.0.0.1:8443}
    session-absolute-timeout: ${BFF_SESSION_ABSOLUTE_TIMEOUT:8h}
    upstream-connect-timeout: 2s
    upstream-read-timeout: 5s
    refresh-wait-timeout: 10s
    max-request-body-bytes: 1048576
    max-response-body-bytes: 10485760
    vault:
      # base64 인코딩한 32바이트 키. 없으면 기동 실패. Git·로그에 남기지 않는다.
      key: ${BFF_VAULT_KEY:}
      key-version: ${BFF_VAULT_KEY_VERSION:1}
      cleanup-interval-ms: 600000

# API 문서: nginx가 /bff/를 BFF로 보내므로 /bff 아래에 둔다. 운영 기본 비활성.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /bff/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /bff/swagger-ui.html
    # 토큰·CSRF 값을 브라우저 저장소에 남기지 않는다.
    persist-authorization: false
