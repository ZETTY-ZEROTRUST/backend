spring:
  datasource:
    url: jdbc:h2:mem:api;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
management:
  server:
    port: 0
zetty:
  jwt:
    jwks-uri: http://127.0.0.1:1/.well-known/jwks.json
