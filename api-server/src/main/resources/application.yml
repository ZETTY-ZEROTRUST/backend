spring:
  application:
    name: api-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8081

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

zetty:
  jwt:
    # API는 서명키 저장소(KMS)에 접근하지 않고 Auth가 공개한 JWKS만 사용한다.
    jwks-uri: ${ZETTY_JWKS_URI:http://auth:8080/.well-known/jwks.json}
