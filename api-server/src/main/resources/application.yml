spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
  application:
    name: api-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8081
  tomcat:
    # 기본값은 Spring 기본값. 과부하 시 무한 적체 대신 거절하도록 env로 상한을 둔다.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    threads:
      max: ${TOMCAT_THREADS_MAX:200}

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

zetty:
  jwt:
    # API는 서명키 저장소(KMS)에 접근하지 않고 Auth가 공개한 JWKS만 사용한다.
    jwks-uri: ${ZETTY_JWKS_URI:http://auth:8080/.well-known/jwks.json}

# API 문서: 운영 기본 비활성, 로컬 Compose에서만 SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
